name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nagara-scroll-debug-key-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Voice command tests
        run: |
          mkdir -p /tmp/voice-tests
          javac -d /tmp/voice-tests app/src/main/java/com/kobatetsu/flowscroll/VoiceCommand.java tests/VoiceCommandTest.java
          java -cp /tmp/voice-tests VoiceCommandTest
      - run: bash gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NagaraScroll-voice-v1.1.0-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
      - name: Publish installable test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NagaraScroll-voice-v1.1.0.apk
          sha256sum NagaraScroll-voice-v1.1.0.apk > SHA256SUMS.txt
          cat > release-notes.txt <<'NOTES'
          ながらスクロール 声操作 1.1.0 テスト版

          APKをAndroidスマホにダウンロードしてインストールしてください。
          旧版のユーザー補助をOFFにして、声操作版をONにします。
          アプリから声操作をONにし、マイクを許可してください。
          「スクロール」で開始、「ストップ」で停止。
          声操作はAndroid 12以降・端末内の日本語音声認識に対応する端末が必要です。
          マイクOFF、画面OFF、パネル終了で声操作を終了。最大15分です。
          ビルドとLint・音声命令テストは通過。実機での音声認識は未確認です。
          NOTES
          tag="test-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" NagaraScroll-voice-v1.1.0.apk SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" NagaraScroll-voice-v1.1.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'ながらスクロール 声操作 1.1.0 テスト版' --notes-file release-notes.txt --repo "$GITHUB_REPOSITORY"
          fi
