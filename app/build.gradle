plugins {
    id "com.android.application"
}

android {
    namespace "com.kobatetsu.flowscroll"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.kobatetsu.flowscroll.voice"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        debug {
            def ciStore = rootProject.file(".ci-signing/debug.keystore")
            if (ciStore.exists()) {
                storeFile ciStore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
